CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=n
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_MAX_XLAT_TABLES=24
CONFIG_LOG_MODE_IMMEDIATE=y

# 32 MiB 짜리 시험 버퍼를 힙에서 받는다
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=67108864
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# ⚠ 캐시를 **명시로** 켠 상태를 확인한다. 기본값이지만 이 측정의 전제다.
CONFIG_DCACHE=y
CONFIG_ICACHE=y

# ── ⚠ 폭주를 **살려 둔다** ─────────────────────────────────────────────
#
# 사다리 나머지는 apps/llm_common/ladder.conf 가 이것을 n 으로 끈다. 이 앱은
# 그 폭주를 진단하는 것이 목적이라 켜 둬야 한다. 그래서 CMakeLists 에서
# EXTRA_CONF_FILE 을 빼고 여기서 명시한다.
#
# 이것이 y 여야 ns16550 드라이버가 IRQ_CONNECT + irq_enable 을 하고, 그래야
# [4][5] 의 irq_disable/irq_enable 대조가 의미를 갖는다.
CONFIG_UART_INTERRUPT_DRIVEN=y
