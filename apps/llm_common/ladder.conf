# 사다리 앱 **전체**가 쓰는 공용 Kconfig 조각.
#
# 각 앱의 CMakeLists.txt 가 find_package(Zephyr) **전에**
#     set(EXTRA_CONF_FILE "${CMAKE_CURRENT_SOURCE_DIR}/../llm_common/ladder.conf")
# 로 집어넣는다.
#
# ⚠ **적용 순서: prj.conf(CONF_FILE) 다음에 이 파일(EXTRA_CONF_FILE)이다.**
#   즉 **여기 값이 앱의 prj.conf 를 덮는다.** 앱이 달리 가야 하면 이 파일을
#   쓰지 말고(CMakeLists 의 set 을 빼고) 그 앱 prj.conf 에 직접 적는다.
#
# ⚠ 앱마다 복사하지 않는다. 복사하면 갈린다 — 이 저장소에서 이미 여러 번
#   겪었다(QEMU overlay, 블롭 주소).

# ── ⚠⚠ uart2 인터럽트 폭주를 끈다 (2026-11-07, L8i 로 원인 확정) ────────
#
# 보드 defconfig(boards/radxa/radxa_zero_3e/radxa_zero_3e_defconfig)에
# CONFIG_UART_INTERRUPT_DRIVEN=y 가 있다. 그 상태에서 uart2 의 인터럽트
# (GIC_SPI 118 = INTID 150)가 **계속 걸려 있고 아무도 지우지 않는다.**
#
# L8i 가 PMU 이벤트 카운터로 셌다 (추론이 아니라 계수다):
#
#     ALU 루프 (메모리 접근 0)      바퀴당 21.96 사이클 · IPC 0.45
#     같은 루프 + daifset #0xf      바퀴당  5.00 사이클 · IPC 1.99
#     ICC_HPPIR1_EL1 = 150          대기 중인 인터럽트가 있다
#     EXC_TAKEN 21,972 / 500,000 바퀴 → 약 386 사이클/예외
#     → **사이클의 약 77% 를 ISR 이 먹는다**
#
# 다른 혐의자는 전부 결백했다 — L1I_CACHE_REFILL · L1D_CACHE_REFILL ·
# L2D_CACHE_REFILL · BR_MIS_PRED 가 모두 바퀴당 0.00 이고, 코드·스택·데이터
# 의 PTE 가 전부 MAIR 0xff(Normal WB R/W-alloc) · SH=3 이다. 캐시도
# 예측기도 매핑도 문제가 아니었다.
#
# 실측 효과 (L6c, 같은 카드·같은 모델·같은 골든값):
#     토큰당 23,600 ms → **1,423 ms (16.6배)** · 12/12 토큰 일치 · 로짓 동일
#
# 사다리 앱은 **셸이 없고** 출력이 printk(폴링, uart_poll_out)뿐이므로
# 인터럽트 구동 UART 가 필요하지 않다. 확인했다 — llm_l* 중 CONFIG_SHELL 을
# 켜는 앱도, uart_irq_*/uart_fifo_*/uart_callback_set 을 쓰는 앱도 없다.
#
# ⚠ **moru 에는 쓸 수 없다** — 셸이 인터럽트 구동 UART 를 요구한다. moru 쪽
#   근본 원인은 아직 미해결이다:
#     (1) ns16550 ISR 이 원인을 지우지 않고 돌아오는가
#     (2) U-Boot 가 IER 비트를 켜 둔 채 넘기고 Zephyr init 이 지우지 않는가
#     (3) dts/arm64/rockchip/rk3568.dtsi:81 이 IRQ_TYPE_EDGE 로 선언했는데
#         ns16550 의 인터럽트는 **레벨**이다 — 사실이면 메인라인 버그이고
#         업스트림 보고 거리다
CONFIG_UART_INTERRUPT_DRIVEN=n
