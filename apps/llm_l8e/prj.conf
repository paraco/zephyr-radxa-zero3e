CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=n
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_MAX_XLAT_TABLES=24
CONFIG_LOG_MODE_IMMEDIATE=y

# ── SMP ────────────────────────────────────────────────────────────────
#
# ⚠ **여기가 위험 구간이다.** CONFIG_PM_CPU_OPS_PSCI 의 psci_init 이
#   PRE_KERNEL_1(콘솔보다 먼저)에서 PSCI_VERSION SMC 를 쏜다. BL31 이
#   응답하지 않으면 한 글자도 못 찍고 죽는다 — 오늘 그 증상을 두 번 봤다.
#
#   그래서 **먼저 확인했다**: `moru reboot probe` 가
#       probe: PSCI 1.1 (raw 0x00010001) — 응답했다
#   를 찍었다. 콘솔이 살아 있는 상태에서 SMC 를 쏘는 수단이라 안전했다.
#   그 확인 없이 이 설정을 켜면 안 된다.
CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=4
CONFIG_PM_CPU_OPS=y
CONFIG_PM_CPU_OPS_PSCI=y

# 코어마다 스레드를 고정해 그 코어의 레지스터를 읽는다
CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y
