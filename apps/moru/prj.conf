# ╔══════════════════════════════════════════════════════════════════════╗
# ║ MoruLab Zephyr RTOS — Radxa ZERO 3E (RK3566)                         ║
# ║ 셸과 로그 둘 다 UART2. USB 는 데이터 포트로 남긴다.                   ║
# ╚══════════════════════════════════════════════════════════════════════╝

# ── 콘솔 ────────────────────────────────────────────────────────────────
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
# ⚠ Zephyr 기본 배너를 끈다. 우리 배너는 LOG_INF 로 찍는다.
#   printk 는 동기 블로킹(115200 에서 줄당 ~9 ms)이라 쓰지 않는다 —
#   USB SET_ADDRESS 의 50 ms 예산을 깨뜨린 원인이다.
CONFIG_BOOT_BANNER=n

# ── 셸 ──────────────────────────────────────────────────────────────────
CONFIG_SHELL=y
# chosen zephyr,shell-uart=&uart2 가 있어 SHELL_BACKEND_SERIAL 은 자동 y
CONFIG_SHELL_PROMPT_UART="Moru > "
# ⚠ 기본 3072(64BIT)은 이 보드의 arm64 규칙(4096 이상)보다 작다
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=256

# ⚠ RK3566 의 UART 는 Synopsys DesignWare 8250 (DW_APB_UART) 이다.
#   이 계열은 UART 가 busy 인 동안 LCR 을 쓰면 busy-detect 인터럽트를 올리고,
#   그건 USR 레지스터를 읽어야만 지워진다. 이 옵션이 꺼져 있으면
#   uart_ns16550.c 의 rx_ready/tx_ready/is_pending 이 USR 을 보지 않아
#   busy 인터럽트가 영원히 지워지지 않고 인터럽트가 폭주한다 (:1186,1278,1341,1408).
#   그러면 main 스레드가 ISR 에 갇혀 POST_KERNEL 을 끝내지 못하고,
#   LED 스레드(우선순위 7)도 스케줄되지 않아 보드가 완전히 무음이 된다.
CONFIG_UART_NS16550_DW8250_DW_APB=y

# ⚠ 진단용. 셸을 켜면 LOG_BACKEND_UART 가 자동으로 꺼져(Kconfig.uart:7) 로그가
#   전부 셸 백엔드를 거친다. 그래서 셸 초기화가 끝나지 못하면 로그가 한 줄도
#   나오지 않는다 — 무음을 진단할 수 없다. 켜 두면 셸과 무관하게 UART 로
#   직접 나온다. 셸이 정상이면 두 번 찍히는데, 그 비용은 감수한다.
#   1단계가 통과하면 다시 지운다.
CONFIG_LOG_BACKEND_UART=y
CONFIG_SHELL_VT100_COLORS=y

# ── 내장 셸 모듈: 켠다 ──────────────────────────────────────────────────
CONFIG_KERNEL_SHELL=y
# ⚠ KERNEL_SHELL 은 imply 만 하고 imply 는 강제가 아니다. thread list/stacks
#   가 이 넷 모두에 depends 하므로 명시한다. 하나라도 없으면 명령이 조용히 사라진다.
CONFIG_INIT_STACKS=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
# ⚠ kernel heap 은 heap.c:8 이 #if K_HEAP_MEM_POOL_SIZE > 0 으로 파일 전체를
#   감싸므로, HEAP_MEM_POOL_SIZE 가 0 이면 명령이 컴파일조차 되지 않는다.
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_DEVICE_SHELL=y
CONFIG_HWINFO=y
CONFIG_HWINFO_SHELL=y
CONFIG_LOG_CMDS=y
CONFIG_LOG_RUNTIME_FILTERING=y

# ── 내장 셸 모듈: 끈다 ──────────────────────────────────────────────────
# ⚠ 기본 y 이고 임의 물리 메모리 읽기/쓰기를 준다. CRU·GRF 를 깨뜨릴 수 있다.
CONFIG_DEVMEM_SHELL=n
# RTC 가 없어 의미 없다 (기본 y 라 명시해서 끈다)
CONFIG_DATE_SHELL=n
# ⚠ usbd_shell.c:49 가 같은 zephyr_udc0 에 두 번째 usbd_context 를 만든다.
#   CDC_ACM_SERIAL_INITIALIZE_AT_BOOT 가 이미 하나를 올려 놓아 충돌한다.
CONFIG_USBD_SHELL=n
# ⚠ PM_CPU_OPS 를 켜지 않는다. psci_init 이 PRE_KERNEL_1 에서 PSCI_VERSION
#   SMC 를 쏘고(pm_cpu_ops_psci.c:166,236), 그건 콘솔보다 먼저다. BL31 이
#   응답하지 않으면 한 글자도 못 보고 무음으로 죽는다. 3단계에서 moru reboot
#   이 arm_smccc_smc() 를 셸에서 직접 불러 안전하게 확인한다.
# CONFIG_PM_CPU_OPS=y

# ── 로그 ────────────────────────────────────────────────────────────────
CONFIG_LOG=y
# ⚠ 즉시 모드 금지 — 실기에서 호스트 리셋 26~38회의 원인이었다
CONFIG_LOG_MODE_DEFERRED=y
# ⚠ 셸 로그 백엔드가 활성화되기 전까지 log_core 는 버퍼를 전혀 비우지 않는다.
#   부팅 로그 전체 + USB 열거 로그가 여기 쌓이고, 넘치면 오래된 것부터 조용히
#   버려진다. 8192 로는 빠듯하다.
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_SIZE=8192
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_TIMEOUT=1000
# ⚠ 로그 타임스탬프. Zephyr 기본값은 log_core.c:282 가 사이클 주파수를 보고
#   고르는데, 이 보드는 24 MHz > 1 MHz 라 k_uptime_get()(1000 Hz)이 선택된다.
#   즉 기본 해상도는 1 ms 이고 Linux 형식 출력의 µs 끝 세 자리가 늘 0 이 된다.
#   moru_boot.c 가 log_set_timestamp_func() 로 24 MHz 사이클 카운터로 바꿔
#   진짜 µs 를 찍는다 (arm arch timer 가 TIMER_HAS_64BIT_CYCLE_COUNTER 를 select).
#   이 설정은 log_timestamp_t 를 64비트로 만들어 랩어라운드를 막는다.
CONFIG_LOG_TIMESTAMP_64BIT=y
# [    0.123400] 형식 (log_output.c:213-220 의 "[%5llu.%06d] ")
CONFIG_LOG_OUTPUT_FORMAT_LINUX_TIMESTAMP=y
# Linux dmesg 처럼 "<inf> " 와 "[main] " 을 뺀다. 소스 태그(moru:/udc_dwc3:)는
#   남긴다 — Linux 도 "usb 1-1: ..." 처럼 서브시스템 접두를 갖는다.
CONFIG_SHELL_LOG_OUTPUT_TIMESTAMP=y
CONFIG_SHELL_LOG_FORMAT_TIMESTAMP=y
CONFIG_SHELL_LOG_OUTPUT_LEVEL=n
CONFIG_SHELL_LOG_OUTPUT_THREAD=n
CONFIG_SHELL_BACKEND_SERIAL_LOG_LEVEL_INF=y
CONFIG_UDC_DRIVER_LOG_LEVEL_INF=y
CONFIG_USBD_LOG_LEVEL_INF=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_INF=y

# ── USB (데이터 포트) ───────────────────────────────────────────────────
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
# 기존 세 앱이 0x0004 를 쓴다. 호스트 USB 캐시가 섞이지 않게 분리한다.
CONFIG_CDC_ACM_SERIAL_PID=0x0005
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="MoruLab"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="MoruLab Zephyr RTOS"
CONFIG_USBD_THREAD_STACK_SIZE=4096

# ── 이 보드에서 실기로 확인된 제약 ──────────────────────────────────────
# ⚠ device_map 을 여러 번 쓴다 (dwc3, USBPHY GRF, CRU, OTP)
CONFIG_MAX_XLAT_TABLES=16
CONFIG_UDC_DWC3_STACK_SIZE=4096
CONFIG_STACK_SENTINEL=y

# ⚠ 켜지 말 것 — 켜면 Zephyr 가 기동조차 못 한다 (LED·콘솔 모두 무음)
# CONFIG_FRAME_POINTER / CONFIG_EXCEPTION_STACK_TRACE
# ⚠ CONFIG_STACK_USAGE 는 1단계에서 켜지 않는다 — INIT_STACKS 되살리기와
#   섞으면 기동 실패 시 원인 분리가 안 된다.
