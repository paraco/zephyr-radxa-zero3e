# USB 디바이스 스택은 켜되, 콘솔은 UART2 로 둔다.
#
# 스택이 켜져야 usbd 가 udc_init()/udc_enable() 을 부르고 그래야 dwc3
# 드라이버가 실제로 돈다. 콘솔을 CDC-ACM 으로 보내면 드라이버가 실패할 때
# 실패 원인을 알려 줄 로그 자체가 사라지므로, 콘솔은 UART2 에 남긴다.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
# 부팅 때 스택을 자동으로 올린다 — 앱 코드 없이 udc_init/udc_enable 이 불린다
# ⚠ 끈다 — 이 자동 경로는 CDC-ACM 인스턴스를 **하나만** 등록한다.
#   subsys/usb/device_next/app/cdc_acm_serial.c:65 가
#   usbd_register_class(..., "cdc_acm_0", ...) 를 부르고 함수 이름도
#   register_cdc_acm_0 다. 그 Kconfig help 도 "다른 USB 기능이 필요 없는
#   앱의 기본 시리얼 백엔드 전용" 이라고 적고 있다.
#
#   실기 증상(2026-11-06): cdc_acm_uart1 노드를 추가해도 호스트에 포트가
#   하나만 보였다. 드라이버 인스턴스는 생겨 device_is_ready() 가 true 인데
#   USB 디스크립터에는 인터페이스가 2개(CDC 하나)뿐이었다.
#
#   → src/moru_usbd.c 가 대신 구성한다. usbd_register_all_classes() 로
#     사용 가능한 인스턴스를 전부 등록하므로 CDC 를 더 늘려도 코드를
#     고치지 않는다.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
# ⚠ CDC_ACM_SERIAL_PID·PRODUCT_STRING 은 INITIALIZE_AT_BOOT 하위 심볼이라
#   그것을 끈 지금은 존재하지 않는다. VID·PID·문자열은 src/moru_usbd.c 가
#   정한다 (MORU_USB_VID 0x2fe3 · MORU_USB_PID 0x0005 ·
#   "MoruLab" / "MoruLab Zephyr RTOS"). 호스트에 보이는 이름이므로 그쪽을
#   고친다.

# 진단이 목적이므로 USB 쪽 로그를 모두 켠다
CONFIG_LOG=y
# DBG 는 줄 수가 너무 많다 — 타이밍에 영향을 준다. 판정에 필요한 INF 만.
CONFIG_UDC_DRIVER_LOG_LEVEL_INF=y
CONFIG_USBD_LOG_LEVEL_INF=y
# ⚠ INF 로 두면 **수신한 모든 바이트가 hexdump 된다** —
#   usbd_cdc_acm.c:315 의 LOG_HEXDUMP_INF(buf->data, buf->len, "").
#   OTA 로 171 KB 를 받으면 로그가 폭발하고, 그것을 다시 CDC 로 내보내려
#   하면서 전송이 사실상 멈춘다(실기에서 120초를 넘겼다). cdc_acm_fifo_read
#   안의 LOG_INF 도 같다. Zephyr 공식 overlay-usb.conf 가
#   USBD_CDC_ACM_LOG_LEVEL_OFF=y 를 쓰는 이유가 이것이다.
#
#   WRN 으로 둔다 — OFF 가 아니라 WRN 인 이유는 "Invoked by inappropriate
#   context" 같은 실제 경고는 봐야 하기 때문이다.
# ⚠ WRN 이어야 한다 — INF 면 usbd_cdc_acm.c:315 의 LOG_HEXDUMP_INF 가
#   수신 바이트를 전부 찍어 대량 전송을 따라가지 못한다. 진단 때 INF 로
#   켜서 수신 경로가 정상임을 확인했고(64바이트 완전 수신, 4096 에서
#   96 %), 그 2 % 부족도 hexdump 지연 때문이었다.
#   "Invoked by inappropriate context" 같은 실제 경고는 WRN 에서 보인다.
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y

# ⚠ 즉시 출력 모드. 어딘가에서 멈추면 버퍼에 남은 로그가 날아가므로,
#   한 줄씩 바로 내보내 '어디까지 갔는지' 를 알 수 있게 한다.
# ⚠ 즉시 모드를 쓰지 않는다 — 이것이 열거 실패의 원인이었다.
#
#   즉시 모드는 로그 한 줄을 그 자리에서 UART 로 밀어내며 스레드를 멈춘다.
#   115200 에서 100자는 약 9 ms 이고, 리셋 처리 하나가 12줄 이상을 찍으니
#   100 ms 가 넘는다. USB 규격은 SET_ADDRESS 가 50 ms 안에 완료되어야
#   한다고 정하므로, 로그가 그 예산을 통째로 먹고 호스트가 타임아웃·리셋을
#   반복했다 (실기에서 26~38회).
#
#   지연 모드는 로그 스레드가 따로 내보내므로 드라이버 스레드를 막지 않는다.
CONFIG_LOG_MODE_DEFERRED=y
# main 이 USB CDC-ACM 이라 **터미널을 열 때까지 백엔드가 붙지 않는다.**
# deferred 로그는 그동안 이 버퍼에 쌓이고, 넘치면 오래된 것부터 조용히
# 버려진다 — 그러면 부팅 로그 앞부분이 사라져 "무음"처럼 보인다.
# 부팅 로그가 ~45줄이라 8192 로도 될 것 같지만 여유가 없다. 8 KiB 를 더
# 쓰는 값이 1 MiB 중에서 싸다 (교란 변수를 미리 없앤다).
CONFIG_LOG_BUFFER_SIZE=16384

# ⚠ 실기에서 "xlat tables low: 7 of 8 in use" 경고가 났다. device_map 을
#   여러 번 쓰므로(dwc3, GPIO, USB2PHY GRF) 기본값 8 로는 빠듯하다.
CONFIG_MAX_XLAT_TABLES=16

# ⚠ 실기에서 크래시했다 — ELR 과 lr 이 같은 쓰레기 주소(0xffffff80ffffffd0)
#   였다. ret 이 망가진 복귀 주소로 돌아간 것, 즉 스택 손상이다.
#
#   드라이버 스레드 기본값이 1024 바이트인데 CONFIG_LOG_MODE_IMMEDIATE 는
#   호출자 스택에서 로그를 포매팅·출력하므로 훨씬 많이 쓴다. 핸들러 하나가
#   여러 줄을 찍으면 넘친다.
CONFIG_UDC_DWC3_STACK_SIZE=4096

# 다음에 또 넘치면 '쓰레기 점프' 가 아니라 명확한 메시지로 보이게 한다.
# 스택 손상이 원인이 아니었다면 이 설정들이 그것도 알려 준다.
# CONFIG_HW_STACK_PROTECTION 은 이 arm64 타깃에서 지원되지 않는다.
# 소프트웨어 감시자(sentinel)로 대신한다 — 넘치면 명확히 알려 준다.
# 넘침을 쓰레기 점프가 아니라 명확한 메시지로 보이게 한다.
# (기동을 깨뜨린 것은 FRAME_POINTER 였고 이것은 무해했다)
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
# CONFIG_STACK_USAGE=y   # 기동 실패 원인 가리기 위해 임시로 끔
# CONFIG_INIT_STACKS=y   # 기동 실패 원인 가리기 위해 임시로 끔

# CONFIG_DEBUG_THREAD_INFO=y   # 기동 실패 원인 가리기 위해 임시로 끔

# ── 실험 1 (2026-11-06): 역추적 재시험 ────────────────────────────────
#
# 과거 기록: FRAME_POINTER / EXCEPTION_STACK_TRACE 를 켜면 Zephyr 가
# 기동조차 하지 못했다 (LED 도 콘솔도 무음).
#
# ⚠ 그 증상은 INIT_STACKS 와 **똑같았고, 그쪽 원인은 EL2 데이터 캐시였다.**
#   (ARM64_DCACHE_ALL_OPS + ARM64_BOOT_DISABLE_DCACHE 로 해결, 실기 확인)
#   프레임 포인터도 스택을 더 건드리므로 같은 원인일 수 있다. 캐시 두 설정이
#   켜진 지금 구성에서 다시 시험한다.
#
# 한 줄로 체인 넷이 켜진다 — 쪼갤 수 없다:
#   ARCH_HAS_STACKWALK      default y, depends on FRAME_POINTER
#                           (arch/arm64/core/Kconfig:210, CPU_CORTEX_A 안)
#     -> ARCH_STACKWALK     default y (arch/Kconfig:489)
#       -> EXCEPTION_STACK_TRACE  default y (subsys/debug/Kconfig:317)
# 즉 FRAME_POINTER 없이는 나머지가 선택 자체가 안 된다. 과거 기록이
# "둘 다"로 적은 것은 사실상 하나였다.
#
# 전제조건은 이미 넣었다 — SHELL_STACK_SIZE=4096 (실측 71 % 근거, 아래).
# 프레임 포인터는 스택을 더 쓰므로 3072 에서 시험하면 "기동 실패"와
# "셸 스택 넘침"을 가릴 수 없다.
#
# 판정:
#   부팅 + Moru > → 역추적을 되찾았다. 남은 B1~B4 의 디버깅 비용이 내려간다
#   무음           → 캐시와 무관한 별개 원인. 이 줄을 지우고 돌아간다
#                    (동작판 사본: 스크래치패드 zephyr-usbmain-good.bin
#                     146048 B, config-usbmain-good)
#
# ✅ 안전한 검증 수단이 함께 생겼다 — CONFIG_KERNEL_THREAD_SHELL_UNWIND 가
#   자동으로 켜져 `kernel thread unwind [<id16진수>]` 명령이 붙는다
#   (subsys/shell/modules/kernel_service/thread/unwind.c:53, 인자를 빼면
#    현재 스레드). 살아 있는 스레드의 콜 스택을 찍으므로 **고장 코드를
#   넣지 않고** 역추적을 확인할 수 있다 — 일부러 깨뜨리는 것은 규칙 5 가
#   금지하는 패턴이고(moru_stage.c 가 그렇게 태어났다) 이제 필요도 없다.
#
#   주소를 함수 이름으로 바꾸려면:
#     ~/zephyr-sdk-1.0.1/gnu/aarch64-zephyr-elf/bin/aarch64-zephyr-elf-addr2line \
#       -e /tmp/claude-501/rz3e-build/zephyr/zephyr.elf -f -C <주소>
CONFIG_FRAME_POINTER=y

# ⚠ usbd 스레드 스택 — Zephyr 기본값 1024 로는 넘친다 (실기 확인:
#   "FATAL ERROR 2: Stack overflow", Current thread: usbd).
#
#   1024 는 32비트 MCU 기준 값이다. arm64 는 64비트 레지스터 31개라
#   문맥 저장만으로도 크고, CONFIG_LOG_MODE_IMMEDIATE 는 로그를 호출자
#   스택에서 포매팅한다. 이 보드의 다른 스택(main·workqueue·ISR·idle)은
#   이미 4096 인데 이것만 기본값으로 남아 있었다.
CONFIG_USBD_THREAD_STACK_SIZE=4096

# 직렬번호 문자열 디스크립터를 위해 hwinfo 를 켠다.
# 구현은 drivers/hwinfo/hwinfo_rk3566.c (자리표 — 주석 참고).
CONFIG_HWINFO=y

# ── 1단계 최소 시험: usbuart 와의 차이는 이 두 줄이 전부다 ────────────────
#
# 5줄까지 줄였는데도 무음이었다. 그 중 셋(SHELL_STACK_SIZE, DW8250,
# LOG_BACKEND_UART)은 내가 추측으로 더한 것이고 기능에 필수가 아니다.
# 기능이 요구하는 최소치만 남긴다. 이것도 무음이면 CONFIG_SHELL 자체가
# 지금 이 보드와 맞지 않는다는 뜻이고, 그건 훨씬 근본적인 발견이다.
#
# 뺀 것과 이유:
#   SHELL_STACK_SIZE=8192  → 기본값(arm64 3072)을 쓴다. 더한 근거가 추측이었다
#   UART_NS16550_DW8250_DW_APB=y → poll_out 은 LSR_THRE 를 쓰므로 콘솔과
#       무관하고(uart_ns16550.c:986), RK3566 에 USR 이 있는지 TRM 으로
#       확인하지 않았다
#   LOG_BACKEND_UART=y → 셸 백엔드와 같은 UART 에 두 번째 백엔드를 붙이는
#       것이라 그 자체가 미검증이다
CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_UART="Moru > "

# ⚠ 셸 백엔드를 폴링 모드로. SHELL=y 가 이 보드에 들여오는 유일하게 새로운
#   것이 UART 인터럽트이고, 이 보드는 그 경로를 한 번도 쓴 적이 없다
#   (기존 세 앱은 전부 셸이 없다). 폴링이면 인터럽트를 아예 쓰지 않는다.
#   이것으로 부팅하면 인터럽트 경로가 범인으로 확정되고, 그래도 죽으면
#   인터럽트 가설은 완전히 폐기된다.
CONFIG_SHELL_BACKEND_SERIAL_API_POLLING=y

# ── KERNEL_SHELL 이 imply 로 끌고 오는 것들을 명시적으로 끈다 ────────────
#
# .config 를 usbuart 와 직접 비교해 보니 내가 쓴 2줄이 아니라 70여 개가
# 달랐다. CONFIG_SHELL=y 한 줄이 KERNEL_SHELL·DEVICE_SHELL·DEVMEM_SHELL·
# DATE_SHELL 을 기본 y 로 켜고, KERNEL_SHELL 이 다시 INIT_STACKS 와
# THREAD_MONITOR 를 imply 한다. imply 는 강제가 아니라 끌 수 있다.
#
# INIT_STACKS 가 특히 중요하다 — 동작하는 usbuart 에는 없고 실패한 모든
# 빌드에 있었다. usbuart/prj.conf:61-62 가 "기동 실패 원인 가리려고 껐다"
# 고 적어 둔 그 설정이다. arm64 리셋 경로(reset.S:204-215)에서 MMU 와
# 콘솔보다 먼저 ISR 스택을 0xAA 로 칠한다. 이 보드의 수치로는 그 루프가
# 정상 종료하는 것을 확인했지만(시작·끝 차이 0xFF8), 상관관계가 분명하니
# 변수를 줄인다.
#
# DEVMEM_SHELL 은 임의 물리 메모리 쓰기라 어차피 끄려던 것이다.
# ── A 시험: 범인 특정 ────────────────────────────────────────────────────
#
# 네 설정을 전부 끄니 부팅했다. 이제 어느 것이 범인인지 가린다.
#
# 기능을 직접 시험하는 쪽으로 설계했다. kernel thread list/stacks 는
# INIT_STACKS + THREAD_MONITOR + THREAD_STACK_INFO 셋 모두를 요구한다
# (thread/Kconfig:16-18,26-28). 그래서 그 셋을 켜고 나머지 둘은 끈다.
#   부팅하면 → 사용자가 고른 "스레드·스택" 명령을 바로 얻는다
#   실패하면 → 범인이 INIT_STACKS 또는 THREAD_MONITOR 로 좁혀진다
#              (DEVMEM/DATE 는 셸 명령만 더하므로 무죄 쪽에 가깝다)
#
# THREAD_STACK_INFO 와 THREAD_NAME 은 usbuart 설정에 이미 있다.
# A-2 시험 결과 반영:
#   넷 다 끈 판(777091b)  → 부팅 ✅ (Moru > 프롬프트·help 동작)
#   INIT_STACKS+THREAD_MONITOR 켠 판(464a4ce) → 무음 ❌
#   → DEVMEM_SHELL·DATE_SHELL 은 무죄 (두 판 모두 꺼져 있었다)
#   → 범인은 INIT_STACKS 또는 THREAD_MONITOR
#
# 이제 둘을 가른다. INIT_STACKS 는 arm64 리셋 경로(reset.S:204-215)에서
# MMU·콘솔보다 먼저 ISR 스택을 0xAA 로 칠하고, THREAD_MONITOR 는
# 스레드 생성 시 기록부만 잇는다. 전자가 훨씬 유력하므로 그것만 끈다.
#   부팅하면 → INIT_STACKS 가 범인. thread list/stacks 를 포기한다
#              (THREAD_MONITOR 는 남으므로 thread suspend/resume/kill 은 쓴다)
#   무음이면 → THREAD_MONITOR 가 범인. 예상 밖이고 더 파야 한다
#
# ── 실험 B0 (2026-11-06): EL2 데이터 캐시 가설을 가른다 ──────────────────
#
# 결과(fc0d8eb): INIT_STACKS 가 유죄로 입증됐다. 그러나 기전은 설명되지
# 않았다 — reset.S:199-215 의 칠하기 루프는 이 보드 수치로 정상 종료한다.
#
# 2026-11-06 에 유력한 가설이 섰다. 범인은 루프가 아니라 **그 루프가 도는
# 시점의 캐시 상태**다. 근거 셋 다 확인했다:
#
#   ① Zephyr 가 EL2 에서 부팅한다 — U-Boot 가 EL2(SPSR 0x3c9)에서 go 한다
#      (실측, docs/hardware-verified.md:1348)
#   ② arch/arm64/core/reset.c:158 의 dcache clean+disable 블록이
#      컴파일조차 되지 않는다 — CONFIG_ARM64_DCACHE_ALL_OPS 가 n 이라
#      거기 의존하는 ARM64_BOOT_DISABLE_DCACHE 는 선택 자체가 안 된다
#   ③ arch/arm64/core/Kconfig:446 의 help 가 정확히 이 위험을 기술한다 —
#      "To make it safe, if data cache is enabled in case of Zephyr is
#       booting from EL2, enable this option, it will clean and invalidate
#       all data cache and then disable data cache"
#
# 기전(가설): go 는 booti 와 달리 캐시를 정리하지 않으므로 EL2 의 MMU·
# dcache 가 켜진 채 진입한다 → 0xAA 칠하기가 ISR 스택 4 KiB 를 dcache 에
# dirty 로 남긴다 → switch_el 로 EL1 에 내려가면 SCTLR_EL1 이 초기값이라
# MMU·C 가 꺼져 이후 스택 접근은 캐시를 우회해 DRAM 으로 간다 → 나중에
# 그 stale dirty 줄이 evict 되며 EL1 이 DRAM 에 써 둔 값을 0xAA 로 덮는다
# → 복귀 주소 손상 → PRE_KERNEL_1 전에 무음.
#
# INIT_STACKS=n 이면 EL2 구간에서 더럽혀지는 것이 함수 프레임 수백 바이트
# 뿐이고 그 영역은 EL1 이 곧 다시 쓴다. 4 KiB 를 칠할 때만 "EL1 이 아직
# 쓰지 않은 깊은 영역"에 stale 줄이 남는다 — "루프는 정상인데 켜면 죽는"
# 모순이 이것으로 설명된다.
#
# ✅ 결과 (2026-11-06 실기): 부팅했다. 가설 확정.
#   Moru > 프롬프트 · USB CDC-ACM 열거 · <err> 0줄 ·
#   kernel thread list 와 kernel thread stacks 둘 다 동작한다. 후자는
#   IRQ 00 = ISR 스택까지 보여준다 (usage 500/4096) — 0xAA 칠하기가
#   정상 작동한다는 직접 증거다.
#
#   INIT_STACKS 는 양쪽 다 y 인데 캐시 두 설정 유무로 결과가 뒤집혔다:
#     464a4ce (캐시 설정 없음) → 무음 ❌
#     ef6780f (캐시 설정 있음) → 부팅 ✅
#   즉 진짜 원인은 INIT_STACKS 가 아니라 EL2 부팅 시 dcache 미정리였다.
#
# ⚠ 아래 캐시 두 줄을 지우면 보드가 부팅하지 않는다. 이 보드의 필수
#   설정이다. 동작 확인된 바이너리 사본은 세션 스크래치패드의
#   zephyr-known-good.bin (146056 B, 캐시 설정 없이 INIT_STACKS=n 판).
#
CONFIG_INIT_STACKS=y
CONFIG_ARM64_DCACHE_ALL_OPS=y
CONFIG_ARM64_BOOT_DISABLE_DCACHE=y

CONFIG_THREAD_MONITOR=y
CONFIG_DEVMEM_SHELL=n
CONFIG_DATE_SHELL=n

# 셸 스레드 스택. arm64 기본 3072 는 이 구성에 부족하다 — 실측 근거:
#   kernel thread stacks 출력에서 shell_uart 가 2196/3072 (71 %) 였다.
#   다른 스레드는 모두 4096 인데 이것만 3072 였고 여유가 876 바이트다.
#   arm64 는 레지스터 31개 문맥만으로도 크니 명령이 몇 단계 깊어지면
#   넘친다. 되찾은 thread stacks 명령으로 추측 없이 결정했다.
# ⚠ FRAME_POINTER 재시험의 전제조건이기도 하다 — 프레임 포인터를 켜면
#   스택 사용이 늘어 71 % 에서 넘칠 수 있고, 그러면 "기동 실패"와 "셸
#   스택 넘침"을 가릴 수 없다. 교란 변수를 먼저 없앤다.
CONFIG_SHELL_STACK_SIZE=4096


# ── main 은 USB · 안 되면 UART 1개 (2026-11-06 사용자 확정 원칙) ────────
#
# chosen 지정은 app.overlay 가 한다 (console·shell → cdc_acm_uart0).
# 진단은 diag-uart.overlay 로 빌드해 uart2 로 되돌린다. 이 파일에는
# 모드별 Kconfig 차이가 없다 — 셸 백엔드가 폴링 모드라 양쪽 같은 코드다.
#
# 셸 백엔드를 폴링으로 두는 근거 (CDC 에서도 안전하다):
#   usbd_cdc_acm.c:1014 의 poll_out 은 링버퍼가 차면 ISR 안이거나
#   flow_ctrl 이 false 일 때 **버린다**. flow_ctrl 은 DT 의
#   hw-flow-control 에서 오고(:1380) 우리 CDC 노드엔 없으므로 false 다.
#   즉 터미널을 열지 않아도 블록하지 않는다. 따라서
#   CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR(인터럽트 모드 전용,
#   Kconfig.backends:148) 가 필요 없고, 검증된 폴링 모드를 유지한다.
#
# ── USB 가 무음일 때 가르는 순서 (이 묶음의 실패 분석 계획) ────────────
#   ① UART2 에 [2][<S][S>][<U][U>][M] 마커가 나오는가
#        → 나오면 커널은 살았고 CDC 경로 문제다. ②로
#        → 안 나오면 부팅 자체가 깨졌다. 캐시 두 설정과 진입점을 먼저 본다
#   ② 마커 중 [S>] 까지 나오는가 → 셸 백엔드 init 통과 여부
#   ③ ioreg 에 장치가 보이는가 → 열거 여부 (셸과 무관하게 판정된다)
#   ④ ①②③ 다 되는데 프롬프트가 없으면 → 터미널에서 엔터를 쳐 본다
#        (열기 전 출력은 버려진다 — 위 poll_out 설명)
#   ⑤ 그래도 안 되면 → diag-uart.overlay 빌드로 카드를 교체한다


# ── B1: Linux dmesg 형식 부팅 메시지 (2026-11-06) ──────────────────────
#
# Zephyr 기본 배너(*** Booting Zephyr OS build ... ***)를 끄고 우리 배너로
# 대체한다. src/moru_boot.c 가 SYS_INIT 우선순위로 순서를 보장한다.
#
# ⚠ 이 한 줄이 CONFIG_EARLY_CONSOLE 도 함께 끈다 — BOOT_BANNER 가 그것을
#   select 하기 때문이다 (lib/os/Kconfig:150). 무해하다: EARLY_CONSOLE 은
#   stdout 드라이버를 평소보다 일찍 초기화하는 디버깅 옵션이고
#   (subsys/debug/Kconfig:164) 우리는 stdout 을 쓰지 않는다. 초기 출력은
#   src/moru_mark.c 가 uart_poll_out 으로 직접 하고, 로그는 deferred 다.
#   BOOT_BANNER 가 select 하던 PRINTK 는 셸이 따로 요구해 y 로 남는다(확인).
CONFIG_BOOT_BANNER=n

# "[    0.123456] " 형식 — Linux 와 같다 (log_output.c:213-220).
# ⚠ 해상도는 1 ms 다. 이 보드는 24 MHz 라 log_core.c:282 의
#   sys_clock_hw_cycles_per_sec() > 1000000 검사를 통과하지 못하고
#   default_lf_get_timestamp(k_uptime_get(), 1000 Hz)를 쓴다. 즉 마지막 세
#   자리는 항상 0 이다. 랩어라운드는 없다(64비트 uptime).
CONFIG_LOG_OUTPUT_FORMAT_LINUX_TIMESTAMP=y

# ⚠ 필수 — 없으면 약 179 초에 시각이 0 으로 되돌아간다.
#
#   log_msg.h:33-36 이 이 설정 없으면 log_timestamp_t 를 uint32_t 로 둔다.
#   moru_boot.c 가 타임스탬프를 24 MHz 사이클 카운터로 바꿨으므로
#   2^32 / 24e6 = 178.96 s 에서 감긴다. 그러면 [  178.9xx] 다음 줄이
#   [    0.0xx] 로 찍히고 moru info 의 "가동"(k_uptime_get)과 어긋난다.
#
#   ⚠ 계획서(보정 3)의 "랩어라운드 없음" 은 **기본 타임스탬프
#     (k_uptime_get, 1 kHz)** 기준이었다. moru_boot.c 가 24 MHz 로 바꾸면서
#     그 전제를 깼다. 설정 하나를 바꾸면 다른 분석의 전제가 무효가 되는
#     사례다 (docs/bringup-rules.md 규칙 3 — .config 로 확인한다).
#   대가는 로그 메시지당 4바이트다. 16384 버퍼에서 무시할 수 있다.
CONFIG_LOG_TIMESTAMP_64BIT=y

# 셸 로그 백엔드의 접두사를 걷어낸다 (shell_log_backend.c:160-166).
#   "<inf> " 제거 · "[main] " 제거
# ⚠ 소스 태그(moru:·udc_dwc3:)는 **남긴다** — Linux dmesg 도
#   "[    0.1] usb 1-1: ..." 처럼 서브시스템 접두를 갖는다. 출처가 구분되어
#   읽기도 쉽다. 그래서 SHELL_LOG_OUTPUT_SKIP_SOURCE 는 기본 n 그대로 둔다.
CONFIG_SHELL_LOG_OUTPUT_LEVEL=n
CONFIG_SHELL_LOG_OUTPUT_THREAD=n

# ── B1 종료 조건 ───────────────────────────────────────────────────────
#   ① [    0.123456] 형식으로 배너·단계 메시지가 나온다
#   ② shell stats show 의 Lost logs: 0  — 부팅 메시지가 ~15줄 늘었다.
#      기준선은 11-06 USB main 에서 측정한 0 이다 (UART 빌드 값이 아니다)
#   ③ 호스트에 "MoruLab Zephyr RTOS" · PID 0x0005 로 보인다 (ioreg)
#   ④ 열거 유지 · <err> 0줄 · kernel thread unwind 여전히 동작


# ── B2: 커널 상태·진단 셸 모듈 (2026-11-06) ────────────────────────────
#
# ⚠ kernel heap 은 HEAP_MEM_POOL_SIZE > 0 이 없으면 **컴파일조차 되지
#   않는다** — heap.c:8 이 파일 전체를 #if K_HEAP_MEM_POOL_SIZE > 0 으로
#   감싼다. SYS_HEAP_RUNTIME_STATS 만으로는 명령이 생기지 않는다.
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# hwinfo devid / reset_cause. 링크 걱정 없다 —
# drivers/hwinfo/CMakeLists.txt:8 이 CONFIG_HWINFO 면 hwinfo_weak_impl.c 를
# 항상 링크하므로, 우리가 구현하지 않은 reset_cause 는 -ENOSYS 를 돌려준다.
CONFIG_HWINFO_SHELL=y

# log status / enable / disable / list_backends
CONFIG_LOG_CMDS=y
CONFIG_LOG_RUNTIME_FILTERING=y

# ── B2 종료 조건 ───────────────────────────────────────────────────────
#   ① moru info 의 값이 전부 맞다 (버전·해시·보드·CPU·메모리·칩ID·콘솔)
#   ② 타임스탬프가 0 부터 시작한다 — 첫 로그가 [    0.000xxx]
#      (B1 에서는 6.699 초였다. CNTVCT_EL0 가 SoC 리셋부터 돌기 때문)
#   ②-b **부팅 후 3분(180 s)을 넘겨도 시각이 단조 증가한다** —
#      LOG_TIMESTAMP_64BIT 가 없으면 178.96 s 에서 0 으로 감긴다.
#      moru info 의 "가동" 값과 로그 시각을 비교해 확인한다
#   ③ 배너에 "Bootloader: 6.3xx s before Zephyr entry" 가 나온다
#   ④ kernel heap · hwinfo devid · log status · app version 동작
#   ⑤ 열거 유지 · <err> 0줄 · Lost logs: 0


# ── B4(앞당김): moru reboot — Kconfig 추가 0개 ─────────────────────────
#
# CONFIG_REBOOT 과 CONFIG_PM_CPU_OPS 를 **켜지 않는다.** 후자는 psci_init 이
# PRE_KERNEL_1 에서 PSCI_VERSION SMC 를 쏘는데 그건 콘솔보다 먼저다 — BL31 이
# 응답하지 않으면 무음으로 죽어 FRAME_POINTER 때와 증상이 똑같아져 원인
# 구분이 불가능해진다 (계획 보정 2).
#
# 대신 moru_shell.c 가 arm_smccc_smc() 를 셸 핸들러에서 직접 부른다.
# arch/Kconfig:50 에서 ARM64 가 HAS_ARM_SMCCC 를 무조건 select 하므로
# 추가 Kconfig 가 0개다. 위험한 SMC 는 사람이 명령을 칠 때만 나가고,
# 그 시점엔 콘솔이 살아 있고 안내 메시지도 이미 나간 뒤다.
#
# ── moru reboot 종료 조건 ──────────────────────────────────────────────
#   ① moru reboot probe 가 PSCI 버전을 찍는다 (BL31 이 응답한다)
#      얼면 그 자체가 결론이다 — 콘솔에 "probe: issuing..." 이 남는다
#   ② moru reboot 이 실제로 재부팅한다. **판정은 UART2 마커로 한다** —
#      USB 가 끊겨 셸도 끊기므로 USB 로는 확인할 수 없다. 마커
#      [2][<S][S>][<U][U>][M] 이 다시 나오면 재부팅된 것이다
#   ③ 재부팅 뒤 USB 가 다시 열거된다 (호스트가 포트를 다시 잡는다)


# ── OTA 1단계: 두 번째 CDC-ACM (데이터 포트) ───────────────────────────
#
# 노드는 app.overlay 가 만든다 (cdc_acm_uart1). 여기서는 늘어난 버퍼
# 요구만 맞춘다.
#
# ⚠ 이 둘을 올리는 것은 "교란 변수 제거" 다. 두 번째 인스턴스가 bulk
#   IN/OUT·notification 버퍼를 더 쓰는데, 부족하면 "열거는 되는데 데이터가
#   안 온다" 같은 모호한 증상이 나와 원인을 가릴 수 없다. 기본값
#   (POOL 1024 · COUNT 16)으로도 될 것으로 보이지만(두 CDC 의 상주 버퍼
#   추정 ~350 B), 1 KiB 를 더 쓰는 값이 1 MiB 중에서 싸다.
# OTA 페이로드 무결성 검사 — crc32_ieee() 가 이 설정 없이는 링크되지 않는다
# (undefined reference to crc32_ieee, 실제로 빌드가 실패했다)
CONFIG_CRC=y

CONFIG_UDC_BUF_POOL_SIZE=2048
CONFIG_UDC_BUF_COUNT=24

# ── OTA 1단계 종료 조건 ────────────────────────────────────────────────
#   ① 호스트에 CDC 포트가 **둘** 생긴다 (ls /dev/cu.usbmodem*)
#   ② 첫 번째 포트에서 셸이 그대로 동작한다 (Moru > · moru info)
#   ③ 로그에 bNumInterfaces 가 2 -> 4 로 늘어난다
#   ④ <err> 0줄 · 열거 유지 · Lost logs: 0
#   ⑤ moru info 가 데이터 포트 이름을 찍는다


# ── OTA 1단계-A 종료 조건 (앱이 직접 usbd 구성) ────────────────────────
#   ① 호스트에 CDC 포트가 **둘** 생긴다 (ls /dev/cu.usbmodem*)
#   ② ioreg 의 인터페이스가 **4개** 다 (CDC 하나당 control+data 2개).
#      1단계에서는 2개였고 그것이 "CDC 하나만 등록됐다" 는 증거였다
#   ③ 첫 번째 포트에서 셸이 동작한다 · 호스트 이름 "MoruLab Zephyr RTOS"
#   ④ 직렬번호가 OTP 칩 ID 그대로다 (hwinfo 디스크립터가 살아 있는가)
#   ⑤ <err> 0줄 · Lost logs: 0 · kernel thread unwind 동작
#
# ⚠ 이 묶음은 USB 초기화를 전면 교체하므로 **깨지면 USB 셸을 잃는다.**
#   그래서 먼저 진단 빌드(diag-uart.overlay, 셸이 UART2)로 굽는다 —
#   USB 가 전혀 안 올라와도 셸이 살아 있어 로그를 읽을 수 있다.
#     ./build.sh "$PWD/apps/moru" /tmp/claude-501/rz3e-diag \
#                "$PWD/apps/moru/diag-uart.overlay"
#   그 빌드에서 ①②가 확인되면 USB main 빌드로 올린다.
