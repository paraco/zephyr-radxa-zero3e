# THREAD_RUNTIME_STATS 를 켜되 SCHED_THREAD_USAGE_ALL 만 끈 판.
#
# 의심 지점을 정확히 제거한다 — kernel/init.c:398-402 의
#   _kernel.cpus[id].usage = &_kernel.usage[id];
# 가 ALL 아래에 있다. 즉 struct _cpu 와 _kernel 의 배치를 바꾸는 부분이다.
# htop 은 k_thread_runtime_stats_all_get() 을 쓰지 않으므로 이 구성에서도
# 창 단위 CPU% 가 동작한다 — 뜨면 기능까지 얻는다.
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE_ALL=n
