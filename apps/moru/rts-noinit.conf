# THREAD_RUNTIME_STATS 를 켜고 INIT_STACKS 만 끈 판.
#
# 왜 이 변수인가: INIT_STACKS 는 이 보드가 이미 데인 설정이다 —
# reset.S:199-215 가 EL2 에서 ISR 스택을 0xAA 로 칠하고, 그 더티 캐시 라인이
# 나중에 DRAM 을 덮어 부팅이 조용히 죽었다(ARM64_BOOT_DISABLE_DCACHE 로
# 막아 둔 상태다). THREAD_RUNTIME_STATS 는 그 IRQ 스택 위에서 C 함수를
# 부르게 만든다(isr_wrapper.S:53 의 bl z_sched_usage_stop).
#
# QEMU 로는 이 혈통을 시험할 수 없다 — ARM64_BOOT_DISABLE_DCACHE 는
# z_arm64_el2_init() 안에서만 동작하고(reset.c:158) QEMU 는 EL1 로 들어간다.
#
# 뜨면: 스택 칠하기와의 상호작용이다. 그러면 kernel thread stacks 와
#       htop 의 CPU% 중 하나를 고르는 문제로 바뀐다.
# 안 뜨면: INIT_STACKS 는 무죄이고 다른 곳이다.
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_INIT_STACKS=n
