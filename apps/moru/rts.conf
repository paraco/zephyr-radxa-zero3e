# THREAD_RUNTIME_STATS 를 그냥 켠 판. 기본 하위 설정(SCHED_THREAD_USAGE ·
# _ALL · AUTO_ENABLE)이 전부 따라온다 — 즉 우리가 실제로 원하는 구성이다.
#
# 이 판의 목적은 이등분이 아니라 **죽는 자리를 말하게 하는 것**이다.
# moru_fatal.c 의 핸들러가 uart2 에 ESR·FAR·ELR 을 동기로 찍고, 그 계기는
# moru_fault 로 양성 대조를 거쳤다 (FAR 이 일부러 읽은 주소와 일치,
# addr2line 이 ELR 을 그 소스 줄로 풀어냈다).
#
# 기대하는 결과는 둘 중 하나다.
#   ① === MORU FATAL === 이 찍힌다 → ELR 을 addr2line 에 넣으면 끝난다
#   ② 또 아무 말 없이 멈춘다 → fault 가 아니라 '멈춤'(락·무한대기)이거나
#     예외 벡터가 서기 전에 죽는 것이다. 그 자체가 큰 정보다
CONFIG_THREAD_RUNTIME_STATS=y
