# 진단 빌드 전용 — 셸이 UART2 일 때만 쓴다.
#
#   ./build.sh "$PWD/apps/moru" /tmp/claude-501/rz3e-diag \
#              "$PWD/apps/moru/diag-uart.overlay"  (+ 이 conf)
#
# ⚠ 셸 백엔드를 폴링으로 되돌린다.
#
#   main 빌드(셸이 CDC)는 인터럽트 모드를 쓴다 — CHECK_DTR 이 그 모드에서만
#   되고, 그게 없으면 터미널을 열기 전 로그가 CDC poll_out 에서 조용히
#   버려진다(usbd_cdc_acm.c:1014).
#
#   그러나 UART2 에서 인터럽트 모드를 쓰려면 GIC 트리거 타입이 맞아야
#   한다. 인트리 rk3568.dtsi 는 IRQ_TYPE_EDGE 로 선언하는데 Linux DT 는
#   LEVEL 이고, **TRM 으로 확정하지 못했다**
#   (docs/trm-grounding.md §5 의 2번). 그래서 진단 빌드는 검증된 폴링을
#   유지한다 — 진단 수단이 진단 대상이 되면 안 된다.
CONFIG_SHELL_BACKEND_SERIAL_API_POLLING=y
