CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=n
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_CRC=y
CONFIG_MAX_XLAT_TABLES=24

# ⚠ **printk 를 로그 시스템에서 빼낸다 — 관측 경로를 QEMU 와 같게 만든다.**
#
# 보드 defconfig(boards/radxa/radxa_zero_3e/radxa_zero_3e_defconfig)에
# CONFIG_LOG=y 가 있다(dwc3 드라이버 로깅용). 그러면 CONFIG_LOG_PRINTK 가
# 기본 y 라 **printk 가 지연 로그 버퍼를 거친다.** 그 조합이 이렇다:
#     CONFIG_LOG_MODE_DEFERRED=y
#     CONFIG_LOG_BUFFER_SIZE=1024              ← 1 KB
#     CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=1000  ← 로그 스레드가 1초씩 잔다
#     CONFIG_MAIN_THREAD_PRIORITY=0            ← main 이 그 스레드를 선점한다
# 사다리 앱은 80자 수십 줄을 main 에서 쏟으므로 버퍼가 넘치고(OVERFLOW 로
# 오래된 것부터 버려진다) 로그 스레드는 돌지 못한다.
#
# **QEMU 빌드에는 CONFIG_LOG 이 아예 꺼져 있어 printk 가 직접 나갔다.**
# 즉 같은 코드인데 **관측 경로가 달랐다** — 2026-11-07 실기 첫 시도에서
# L5b 가 완전히 조용했고 이것이 원인 후보 1번이다.
#
# LOG=n 으로 끄지 않고 LOG_PRINTK=n 만 끈다 — 드라이버 로깅은 건드리지 않고
# printk 만 콘솔로 직접 보낸다(동기 출력).
CONFIG_LOG_PRINTK=n
