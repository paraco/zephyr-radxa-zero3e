CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=n
# ⚠ 64 KiB 에서 **256 KiB 로 올렸다** (2026-11-07 밤). SMP + n_threads=4 로
#   llama_init_from_model 이 메인 스택을 더 쓴다 (스레드풀 구성·그래프 예약).
#   STACK_SENTINEL 이 잡아 준 지점이 바로 거기다:
#       [3] 문맥 생성 ...
#       >>> ZEPHYR FATAL ERROR 2: Stack overflow on CPU 0
#       Current thread: 0x4045f2c0 (main)      x1 = 0xf0f0f0f0 (센티넬 패턴)
#
#   ⚠ 그 전 시도의 `ELR=0` NULL 점프도 **같은 원인**이었다. 센티넬이 없어
#     복귀 주소가 조용히 깨진 뒤 15.6초에 엉뚱한 곳에서 터졌다. 센티넬을
#     켜니 9.0초에 정확한 지점에서 잡혔다. 진단 설정을 함께 넣은 것이
#     이것을 살렸다 — 스택만 키웠다면 또 오진했다.
CONFIG_MAIN_STACK_SIZE=262144
CONFIG_MAX_XLAT_TABLES=24

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_CPP_RTTI=y

CONFIG_POSIX_API=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
# CONFIG_DYNAMIC_THREAD_STACK_SIZE 는 아래 멀티코어 절에서 128 KiB 로 올렸다

# ggml_init 이 mem_size(16 MiB)를 **정렬 할당 한 덩이**로 받는다. 아레나가
# 요청과 같으면 정렬 여유가 없어 실패한다(L4 에서 겪었다). 여러 배로 둔다.
CONFIG_COMMON_LIBC_MALLOC=y
# ⚠ L6a 는 **어휘**를 힙에 올린다 — 248,320 토큰. 토큰마다 std::string 과
#   unordered_map 노드 둘(id→token, token→id)이 생기므로 수십 MB 다.
#   창(sram0)이 128 MiB 라 넉넉히 준다. 실제 사용량은 앱이 찍는다.
# ⚠ **창이 256 MiB 가 된 뒤의 값** (2026-11-07, boards/.../radxa_zero_3e.dts).
#     창 262,144 − 정적 비-아레나 9,604 − 여유 6,780 = 245,760 KiB = **240 MiB**
#
#   왜 이만큼 필요한가 — 128 MiB 창에서 L6b 가 멈춘 이유를 측정했다:
#     모델·어휘 고정          62.5 MB
#     가장 큰 **연속** 블록   27.9 MB   ← 합계는 48.3 MB 였다
#     단편화로 잃은 몫        20.5 MB   ← 어휘가 248,320개 토큰을 작은
#                                        조각으로 할당하고 20 MB 를 돌려준다
#     그 27.9 MB 에서 output 0.95 + KV 3.00 + RS 19.27 를 먼저 떼면 4.7 MB
#     남고, 스케줄러 문맥 13.4 MB 가 들어가지 못했다.
#   즉 총량과 **연속성**이 둘 다 모자랐다. 창을 넓혀 둘 다 푼다.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=251658240
CONFIG_HEAP_MEM_POOL_SIZE=4194304

# ⚠ 이것이 있어야 malloc_runtime_stats_get() 이 **링크된다**
#   (zephyr/lib/libc/common/source/stdlib/malloc.c:265-280 이 #ifdef 로 감싼다).
#   없으면 undefined reference 로 끝난다 — 겪었다.
#   west build 의 "RAM 79.48%" 는 아레나를 전부 예약으로 세어서 쓸모가 없다.
#   어휘가 실제로 얼마를 쓰는지 알아야 L6b 의 자리가 있는지 가릴 수 있다.
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# ⚠ **로그를 동기(immediate)로 만든다 — 쓰는 주체를 하나로 유지한 채.**
#
# 보드 defconfig 에 CONFIG_LOG=y 가 있어(dwc3 드라이버용) printk 가 기본으로
# 로그 시스템을 거친다. 기본 조합이 이렇다:
#     CONFIG_LOG_MODE_DEFERRED=y
#     CONFIG_LOG_BUFFER_SIZE=1024              ← 1 KB
#     CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=1000  ← 로그 스레드가 1초씩 잔다
#     CONFIG_MAIN_THREAD_PRIORITY=0            ← main 이 그 스레드를 선점한다
# 사다리 앱은 80자 수십 줄을 main 에서 쏟으므로 버퍼가 넘쳐 **앞부분이
# 버려진다**(2026-11-07 L5b 첫 실기 투입에서 꼬리만 남았다).
#
# ⚠ 처음에 `CONFIG_LOG_PRINTK=n` 으로 고치려 했다가 **보드가 멈췄다.**
#   그러면 UART2 에 쓰는 주체가 둘이 된다 — printk(main, 동기)와 로그
#   백엔드(로그 스레드). 같은 인터럽트 구동 UART 를 동시에 건드려 교착한
#   것으로 보인다(dwc3 로그 한 줄만 나오고 멈췄다).
#
# 그래서 LOG_PRINTK 는 기본(y) 그대로 두고 **모드만 동기로** 바꾼다.
# 버퍼도 스레드도 쓰지 않으므로 유실이 없고 쓰는 주체는 하나다.
#
# ⚠ moru 는 이 설정을 쓰면 안 된다 — 동기 출력이 줄당 ~9 ms 를 잡아먹어
#   USB 열거의 SET_ADDRESS 50 ms 예산을 넘긴다(docs/hardware-verified.md).
#   사다리 앱은 USB 를 열거하지 않으므로 무해하다.
CONFIG_LOG_MODE_IMMEDIATE=y

# ── uart2 인터럽트 폭주 ───────────────────────────────────────────────
#
# CONFIG_UART_INTERRUPT_DRIVEN=n 은 이제 **공용 파일**에 있다:
#     apps/llm_common/ladder.conf
# 근거와 측정값(토큰당 23,600 ms → 1,423 ms, 16.6배)도 그 파일에 있다.
# 여기 복사해 두지 않는다 — 복사하면 갈린다.

# ── 멀티코어 (2026-11-07 밤) ────────────────────────────────────────────
#
# L8e 가 실기에서 네 코어를 올렸다:
#     코어 0 MPIDR 0x81000000 · 1 0x81000100 · 2 0x81000200 · 3 0x81000300
#     네 코어 모두 SCTLR C=1 I=1 M=1
# PSCI CPU_ON 이 동작하고 DT 의 Aff1 기반 번호(rk3568.dtsi)가 실측과 맞는다.
#
# ⚠ 이것이 19:27 에는 침묵했다. 바뀐 것은 **UART 폭주 제거**뿐이다
#   (soc_init/dw_uart_busy.c). 폭주가 있으면 SMP 초기화가 무너진다 —
#   정확한 지점은 미확인이다. 그래서 이 설정은 그 고침에 **의존한다.**
CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=4
CONFIG_PM_CPU_OPS=y
CONFIG_PM_CPU_OPS_PSCI=y

# ggml 의 스레드풀은 pthread 를 쓴다 (ggml-cpu.c:484 의 ggml_thread_create =
# pthread_create, mutex/cond 도 pthread). n_threads=4 면 **워커 3개**를 만든다.
# 기본 상한이 모자라면 pthread_create 가 실패하고 ggml 이 단일 스레드로
# 조용히 떨어진다 — 그러면 '멀티코어가 효과 없다' 로 오진한다. 넉넉히 둔다.
CONFIG_POSIX_THREAD_THREADS_MAX=8

# ⚠ 메인 스레드 외에 워커가 늘어나므로 스택 총량을 다시 본다.
#   워커는 DYNAMIC_THREAD_STACK_SIZE(32 KiB)를 쓴다 → 3 × 32 KiB = 96 KiB.
#   창 여유가 6,780 KB 였으므로 문제 없다.

# ── 4스레드 첫 시도의 충돌 (2026-11-07 밤) ──────────────────────────────
#
# 첫 시도에서 **1단계는 성공했다** — id 11, 로짓 13.078794, 호스트와 일치,
# **450 ms** (1스레드 1452 ms 대비 3.2배). 그 직후 죽었다:
#
#     ESR 0x86000005 · EC 0x21 (Instruction Abort, EL 변화 없음)
#     ELR=0 · FAR=0 → **NULL 로 점프**
#     x3 = 0xfe660000 (UART 베이스) · TPIDRRO 0x02000000… (cpu 2)
#     출력이 두 코어에서 섞여 찍혔다
#
# 복귀 주소가 0 으로 깨지는 것은 **스택 넘침**의 전형이다. 워커는
# pthread_create(NULL attr) 로 만들어지고, Zephyr 는 그때
# CONFIG_DYNAMIC_THREAD_STACK_SIZE 를 쓴다
# (subsys/portability/posix/options/pthread.c:40-41). 32 KiB 였다.
#
# ⚠ 그리고 이 모델은 **융합 커널**을 켠다 (로그의 resolve_fused_ops:
#   fused DeepSeek V4 HC pre/comb/post enabled). 그런 커널은 큰 스택
#   버퍼를 쓸 수 있다.
#
# 추측을 끝낸다 — 둘을 함께 넣는다. 하나는 고침 후보, 하나는 **진단**이다:
#   · 스택을 128 KiB 로 (워커 3개 × 128 KiB = 384 KiB. 창 여유 6.7 MB)
#   · STACK_SENTINEL 로 넘침을 **잡아서 알려 주게** 한다. 지금은 넘쳐도
#     조용히 NULL 로 뛴다 — 그러면 원인을 가릴 수 없다
#
# ⚠ CONFIG_FRAME_POINTER / EXCEPTION_STACK_TRACE 는 **켜지 않는다.**
#   이 보드에서 켜면 기동 자체가 안 된다 (docs/hardware-verified.md).
CONFIG_DYNAMIC_THREAD_STACK_SIZE=131072
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_NAME=y
