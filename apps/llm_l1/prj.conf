CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=n
CONFIG_MAIN_STACK_SIZE=8192

# crc32_ieee / crc32_ieee_update (subsys/crc).
# 다항식 0xedb88320 · 초기 ~0 · 최종 반전 → zlib.crc32 와 같다.
# 이어 쓰기(crc32_ieee_update)도 zlib 와 같은 의미라 청크로 나눠 계산할 수 있다.
CONFIG_CRC=y

# 창 밖 영역을 더 매핑한다. 0x60000000+640MB 는 2 MB 블록 320개 = 추가 L2 2개.
# arm64 기본값은 8 이다(arch/arm64/core/Kconfig:412). 넉넉히 둔다.
CONFIG_MAX_XLAT_TABLES=24
