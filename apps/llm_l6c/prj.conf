CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=n
CONFIG_MAIN_STACK_SIZE=65536
CONFIG_MAX_XLAT_TABLES=24

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_CPP_RTTI=y

CONFIG_POSIX_API=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_STACK_SIZE=32768

# ggml_init 이 mem_size(16 MiB)를 **정렬 할당 한 덩이**로 받는다. 아레나가
# 요청과 같으면 정렬 여유가 없어 실패한다(L4 에서 겪었다). 여러 배로 둔다.
CONFIG_COMMON_LIBC_MALLOC=y
# ⚠ L6a 는 **어휘**를 힙에 올린다 — 248,320 토큰. 토큰마다 std::string 과
#   unordered_map 노드 둘(id→token, token→id)이 생기므로 수십 MB 다.
#   창(sram0)이 128 MiB 라 넉넉히 준다. 실제 사용량은 앱이 찍는다.
# ⚠ **창이 256 MiB 가 된 뒤의 값** (2026-11-07, boards/.../radxa_zero_3e.dts).
#     창 262,144 − 정적 비-아레나 9,604 − 여유 6,780 = 245,760 KiB = **240 MiB**
#
#   왜 이만큼 필요한가 — 128 MiB 창에서 L6b 가 멈춘 이유를 측정했다:
#     모델·어휘 고정          62.5 MB
#     가장 큰 **연속** 블록   27.9 MB   ← 합계는 48.3 MB 였다
#     단편화로 잃은 몫        20.5 MB   ← 어휘가 248,320개 토큰을 작은
#                                        조각으로 할당하고 20 MB 를 돌려준다
#     그 27.9 MB 에서 output 0.95 + KV 3.00 + RS 19.27 를 먼저 떼면 4.7 MB
#     남고, 스케줄러 문맥 13.4 MB 가 들어가지 못했다.
#   즉 총량과 **연속성**이 둘 다 모자랐다. 창을 넓혀 둘 다 푼다.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=251658240
CONFIG_HEAP_MEM_POOL_SIZE=4194304

# ⚠ 이것이 있어야 malloc_runtime_stats_get() 이 **링크된다**
#   (zephyr/lib/libc/common/source/stdlib/malloc.c:265-280 이 #ifdef 로 감싼다).
#   없으면 undefined reference 로 끝난다 — 겪었다.
#   west build 의 "RAM 79.48%" 는 아레나를 전부 예약으로 세어서 쓸모가 없다.
#   어휘가 실제로 얼마를 쓰는지 알아야 L6b 의 자리가 있는지 가릴 수 있다.
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# ⚠ **로그를 동기(immediate)로 만든다 — 쓰는 주체를 하나로 유지한 채.**
#
# 보드 defconfig 에 CONFIG_LOG=y 가 있어(dwc3 드라이버용) printk 가 기본으로
# 로그 시스템을 거친다. 기본 조합이 이렇다:
#     CONFIG_LOG_MODE_DEFERRED=y
#     CONFIG_LOG_BUFFER_SIZE=1024              ← 1 KB
#     CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=1000  ← 로그 스레드가 1초씩 잔다
#     CONFIG_MAIN_THREAD_PRIORITY=0            ← main 이 그 스레드를 선점한다
# 사다리 앱은 80자 수십 줄을 main 에서 쏟으므로 버퍼가 넘쳐 **앞부분이
# 버려진다**(2026-11-07 L5b 첫 실기 투입에서 꼬리만 남았다).
#
# ⚠ 처음에 `CONFIG_LOG_PRINTK=n` 으로 고치려 했다가 **보드가 멈췄다.**
#   그러면 UART2 에 쓰는 주체가 둘이 된다 — printk(main, 동기)와 로그
#   백엔드(로그 스레드). 같은 인터럽트 구동 UART 를 동시에 건드려 교착한
#   것으로 보인다(dwc3 로그 한 줄만 나오고 멈췄다).
#
# 그래서 LOG_PRINTK 는 기본(y) 그대로 두고 **모드만 동기로** 바꾼다.
# 버퍼도 스레드도 쓰지 않으므로 유실이 없고 쓰는 주체는 하나다.
#
# ⚠ moru 는 이 설정을 쓰면 안 된다 — 동기 출력이 줄당 ~9 ms 를 잡아먹어
#   USB 열거의 SET_ADDRESS 50 ms 예산을 넘긴다(docs/hardware-verified.md).
#   사다리 앱은 USB 를 열거하지 않으므로 무해하다.
CONFIG_LOG_MODE_IMMEDIATE=y

# ── ⚠⚠ uart2 인터럽트 폭주를 끈다 (2026-11-07, L8i 로 원인 확정) ────────
#
# 보드 defconfig 에 CONFIG_UART_INTERRUPT_DRIVEN=y 가 있다. 그 상태에서
# uart2 의 인터럽트(GIC_SPI 118 = INTID 150)가 **계속 걸려 있고 아무도
# 지우지 않는다.** L8i 가 PMU 이벤트로 셌다:
#
#     ALU 루프 (메모리 접근 0)      바퀴당 21.96 사이클 · IPC 0.45
#     같은 루프 + daifset #0xf      바퀴당  5.00 사이클 · IPC 1.99
#     ICC_HPPIR1_EL1 = 150          대기 중인 인터럽트가 있다
#     EXC_TAKEN 21,972 / 500,000 바퀴 → 약 386 사이클/예외
#     → **사이클의 약 77% 를 ISR 이 먹는다**
#
# 캐시·예측기·매핑은 전부 결백했다 (L1I/L1D/L2D_REFILL·BR_MIS_PRED 가
# 모두 바퀴당 0.00, PTE 는 MAIR 0xff·SH=3). 유일한 원인이다.
#
# 사다리 앱은 셸이 없고 출력이 printk(폴링, uart_poll_out)뿐이므로
# 인터럽트 구동 UART 가 **필요하지 않다.** 끄는 것이 맞는 고침이다.
#
# ⚠ moru 에는 이 설정을 쓸 수 없다 — 셸이 인터럽트 구동 UART 를 요구한다.
#   moru 쪽 근본 원인(ISR 이 원인을 지우지 않는가 / U-Boot 가 IER 를 켜 둔
#   채 넘기는가 / DTS 의 IRQ_TYPE_EDGE 가 ns16550 의 레벨과 어긋나는가)은
#   따로 가린다. L8j 가 IER·IIR·LSR 을 직접 읽을 예정이다.
CONFIG_UART_INTERRUPT_DRIVEN=n
